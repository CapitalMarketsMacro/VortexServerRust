# Build vortex-server on Linux x86_64 and Windows x86_64.
#
# C++ dependencies come entirely from ConanCenter PRE-BUILT binaries
# (pinned in Vortex/crates/perspective-server/conan.lock) — nothing
# compiles from source, so even a cold cache is fast. The "Verify C++
# deps are pre-built" step enforces this with `conan install
# --build=never`: if a toolchain/lockfile mismatch would trigger a
# source build, the job fails loudly instead of silently compiling Arrow.
#
# The pre-built binaries exist only for specific toolchains, so the
# runners are pinned to match: Linux uses gcc 13 (hence ubuntu-24.04 +
# an explicit gcc-13), Windows uses msvc 194 (VS 2022 on windows-2022).

name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: vortex-server
            conan_profile: linux-x64-static
          - label: windows-x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            binary: vortex-server.exe
            conan_profile: windows-x64-static

    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The vendored Linux x86_64 libsolclient in vendor/solclient/ is
      # wired up via .cargo/config.toml's SOLCLIENT_LIB_PATH. On Windows
      # that path obviously won't link — drop the file so solace-rs-sys
      # falls back to downloading the Windows tarball from GitHub on its
      # own (~12 MB, fetched once and then cached in ~/.cargo).
      - name: Remove vendored-libsolclient cargo config (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Remove-Item -Force .cargo/config.toml

      # ConanCenter's pre-built Arrow (and its transitive deps) for Linux
      # is compiled with gcc 13 / libstdc++11. The package_id is keyed on
      # the compiler major version, so building with any other gcc loses
      # the pre-built match and falls back to a source build. Pin gcc 13
      # and export CC/CXX so both `conan profile detect` and CMake/cc-rs
      # use it consistently — keeping the binary ABI in sync with the
      # downloaded prebuilts.
      - name: Pin GCC 13 (Linux — matches ConanCenter prebuilt toolchain)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13
          echo "CC=gcc-13"  >> "$GITHUB_ENV"
          echo "CXX=g++-13" >> "$GITHUB_ENV"

      - name: Install Rust toolchain (nightly-2026-01-01)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-01
          targets: ${{ matrix.target }}
          components: rustfmt, clippy, rust-src

      - name: Setup Python (for Conan)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Conan 2.x
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "conan>=2,<3"
          conan --version

      - name: Detect default Conan profile
        shell: bash
        run: conan profile detect --force

      # Brings cl.exe, link.exe, etc. onto PATH and exports the MSVC
      # environment vars (INCLUDE/LIB/LIBPATH) that CMake + cc-rs read.
      - name: Setup MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cargo + Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.label }}
          cache-on-failure: true

      # NOTE the `v2` salt: pre-migration caches were built on ubuntu-22.04
      # with gcc 11 and the old source-build conanfile. They contain a stale
      # ~/.conan2/profiles/default (gcc 11) that, if restored, would clobber
      # the gcc-13 default detected above and make the prebuilt match fail.
      # The salt ensures only post-migration caches are ever restored. (The
      # "Verify" step below also re-runs `conan profile detect --force` after
      # this restore as a second safeguard.)
      - name: Conan package cache
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-v2-${{ matrix.label }}-${{ hashFiles('Vortex/crates/perspective-server/conanfile.py', 'Vortex/crates/perspective-server/conan.lock', 'Vortex/crates/perspective-server/conan/profiles/*') }}
          restore-keys: |
            conan-v2-${{ matrix.label }}-

      - name: Print build environment
        shell: bash
        run: |
          echo "OS:      $RUNNER_OS"
          echo "Runner:  ${{ matrix.os }}"
          echo "Target:  ${{ matrix.target }}"
          rustc --version
          cargo --version
          cmake --version | head -1
          conan --version

      # Enforce "pre-built only": resolve the full C++ dependency graph
      # with --build=never, which downloads ConanCenter binaries but
      # refuses to compile anything from source. If the lockfile or the
      # runner toolchain drifts out of sync with the published prebuilts,
      # this fails here with a clear "Missing prebuilt package" error
      # (fix: realign the toolchain or regenerate conan.lock) instead of
      # silently compiling Arrow for 30+ minutes during the cargo build.
      # It also warms ~/.conan2 so the subsequent build compiles nothing.
      - name: Verify C++ deps are pre-built (no source compilation)
        shell: bash
        run: |
          # --force (not --exist-ok): re-pin the default profile to THIS
          # runner's toolchain AFTER the cache restore, which may have
          # overwritten ~/.conan2/profiles/default. On Linux CC/CXX=gcc-13
          # are in the env so this detects gcc 13; on Windows the MSVC env
          # is already set up so it detects msvc 194. The committed profiles
          # only `include(default)`, so this is what keys the package_id.
          conan profile detect --force
          conan install Vortex/crates/perspective-server \
            --output-folder "${RUNNER_TEMP}/conan-verify" \
            --profile:host "Vortex/crates/perspective-server/conan/profiles/${{ matrix.conan_profile }}" \
            --lockfile Vortex/crates/perspective-server/conan.lock \
            --build=never

      # Do NOT set shell: bash here. On Windows that puts Git's
      # /usr/bin/link (a coreutils alias for ln) ahead of MSVC's
      # link.exe on PATH, and rustc ends up feeding MSVC-style linker
      # args to ln. Using the runner default (pwsh on Windows, bash on
      # Linux) keeps the MSVC env from ilammy/msvc-dev-cmd intact.
      - name: Build vortex-server (release)
        run: cargo build --release -p vortex-server --target ${{ matrix.target }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: vortex-server-${{ matrix.label }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 14

  # Publishes a GitHub release with the per-platform binaries attached.
  # Fires only when both build jobs succeed AND the trigger was a vX.Y.Z
  # tag push, so routine main-branch builds don't create releases.
  release:
    name: release ${{ github.ref_name }}
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout (for README)
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package release assets
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          mkdir -p release staging-linux staging-windows

          # Linux: tar.gz of the binary + README. upload-artifact strips
          # the executable bit on the download path, so restore it.
          cp artifacts/vortex-server-linux-x64/vortex-server staging-linux/
          chmod +x staging-linux/vortex-server
          cp README.md staging-linux/
          tar -C staging-linux -czf "release/vortex-server-${tag}-x86_64-linux.tar.gz" \
            vortex-server README.md

          # Windows: zip of the .exe + README. List files explicitly —
          # `zip ... .` without -r reports "nothing to do" because it
          # doesn't recurse, and listing files keeps the archive flat
          # (no leading ./).
          cp artifacts/vortex-server-windows-x64/vortex-server.exe staging-windows/
          cp README.md staging-windows/
          (cd staging-windows && \
            zip -q "../release/vortex-server-${tag}-x86_64-windows.zip" \
              vortex-server.exe README.md)

          ls -lh release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
