[workspace]
resolver = "2"
members = [
    ".",
    "Vortex/crates/perspective",
    "Vortex/crates/perspective-client",
    "Vortex/crates/perspective-server",
    "Vortex/examples/axum-server",
]

[package]
name = "vortex-server"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

[[bin]]
name = "vortex-server"
path = "src/main.rs"

[features]
default = ["solace"]
# Solace PubSub+ ingress (libsolclient via FFI). Enabled by default, but the
# native `solace-rs` / `solace-rs-sys` deps are target-gated to non-Windows
# below: the solace-rs-sys build script hard-panics on Windows, so there is no
# way to compile them there. build.rs only emits the `solace_enabled` cfg when
# this feature is on AND we are not on Windows; the ingress code keys off that
# cfg, so a Windows build silently compiles Solace out and skips Solace-sourced
# tables at runtime with a clear log line. Linux/macOS get Solace via plain
# `cargo build`; pass `--no-default-features` there to opt out.
solace = ["dep:solace-rs", "dep:solace-rs-sys"]

[dependencies]
# Perspective engine
perspective = { path = "Vortex/crates/perspective", features = ["axum-ws"] }

# Web server
axum = { version = ">=0.8,<0.9", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }

# CLI / config
clap = { version = "4", features = ["derive", "env"] }
figment = { version = "0.10", features = ["json", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging / observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt", "registry"] }
tracing-appender = "0.2"

# Errors
anyhow = "1"
thiserror = "1"

# NATS JetStream
async-nats = "0.38"
futures = "0.3"

# WebSocket client (for Websocket-sourced tables)
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }

[profile.dev]
panic = "abort"
opt-level = "s"

[profile.release]
panic = "abort"
opt-level = "z"
codegen-units = 1
lto = true
strip = true

# Solace PubSub+ (libsolclient via FFI; build.rs auto-downloads the C tarball
# unless SOLCLIENT_LIB_PATH or SOLCLIENT_TARBALL_URL is set). The -sys crate is
# pulled in directly so we can call solClient_msg_getBinaryAttachmentString for
# SDT-STRING-wrapped payloads (e.g. from Solace's REST gateway), which the
# high-level wrapper doesn't expose yet.
#
# Target-gated to non-Windows: solace-rs-sys 1.1's build script does
# `panic!("Windows currently not supported")`, so these cannot build on
# Windows. The `solace` feature references them via `dep:`; on Windows the
# deps simply don't exist and the feature resolves to a no-op.
[target.'cfg(not(target_os = "windows"))'.dependencies]
solace-rs = { version = "0.8", optional = true }
solace-rs-sys = { version = "1.1", optional = true }

# NOTE: upstream Perspective also patches `protobuf-src` to a GitHub fork here.
# That patch is deliberately absent: a `[patch]` git source is cloned by cargo
# at resolve time on every cold checkout, even though `protobuf-src` is only
# pulled in by the off-by-default `bundled-protoc` / `protobuf-src` features
# (the Conan protobuf package provides protoc). With the crates.io registry
# as the only source, `cargo build --offline` / `cargo vendor` work with no
# GitHub egress.
[patch.crates-io]
perspective-client = { path = "Vortex/crates/perspective-client" }
perspective-server = { path = "Vortex/crates/perspective-server" }
perspective = { path = "Vortex/crates/perspective" }
