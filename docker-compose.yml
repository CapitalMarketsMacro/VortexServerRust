# Local brokers for testing vortex-server's ingress paths.
#
# The two services are independent — start whichever you need.
#
#   docker compose up -d solace          # Solace broker (~60s to healthy)
#   docker compose up -d nats            # NATS broker with JetStream (~5s)
#   docker compose up -d                 # both
#
#   docker compose logs -f solace        # tail solace
#   docker compose logs -f nats          # tail nats
#   docker compose down                  # stop everything, preserve volumes
#   docker compose down -v               # stop AND wipe persisted state
#
# Endpoints once running:
#   Solace SMF       tcp://localhost:55554     (vortex-server target)
#   Solace REST      http://localhost:9000
#   Solace Manager   http://localhost:8080     (admin / admin)
#   NATS clients     nats://localhost:4222     (vortex-server target)
#   NATS monitoring  http://localhost:8222     (varz, jsz, healthz)

services:
  solace:
    image: solace/solace-pubsub-standard:latest
    container_name: vortex-solace
    shm_size: 1g
    ulimits:
      core: 2
      # Solace's POST check requires hard nofile >= 1048576; lower values
      # cause the broker to crash-loop on startup with "POST Violation 022".
      nofile:
        soft: 2448
        hard: 1048576
    ports:
      # SMF — the protocol libsolclient (and therefore vortex-server) speaks.
      # Port 55555 inside the container is remapped to 55554 on the host
      # because macOS Big Sur+ reserves 55555 for system services; we keep
      # the same mapping everywhere for parity.
      - "55554:55555"
      # SMF over TLS — use this if you point vortex-server at tcps://.
      - "55443:55443"
      # PubSub+ Manager web UI + SEMP REST.
      - "8080:8080"
      # WebSocket SMF (browser clients, not used by vortex-server itself).
      - "8008:8008"
      # REST messaging — handy for ad-hoc test publishes via curl.
      - "9000:9000"
    environment:
      - username_admin_globalaccesslevel=admin
      - username_admin_password=admin
      - system_scaling_maxconnectioncount=100
    volumes:
      - solace-storage:/var/lib/solace
    restart: unless-stopped
    healthcheck:
      # Probing the default Message VPN via SEMP confirms both that the
      # management plane is up AND that the messaging plane has provisioned
      # the VPN clients will connect to. (/SEMP/v2/__about returns 400; the
      # monitor/msgVpns endpoint is the meaningful "ready for traffic" check.)
      test: ["CMD-SHELL", "curl -sfu admin:admin http://localhost:8080/SEMP/v2/monitor/msgVpns/default >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 60s

  nats:
    # Alpine variant ships busybox-wget so we can run a real healthcheck;
    # the default `nats:latest` is a scratch image with the binary only.
    image: nats:alpine
    container_name: vortex-nats
    command:
      - "--name=vortex-nats"
      # Enable JetStream (required by the orders.* simulator). Persistent
      # data lands in /data, which is mounted from the named volume so a
      # `docker compose down` (without -v) preserves stream state.
      - "--jetstream"
      - "--store_dir=/data"
      # HTTP monitoring endpoint for /healthz, /varz, /jsz.
      - "--http_port=8222"
    ports:
      # Client connections — what vortex-server's NATS ingress and the
      # simulators connect to.
      - "4222:4222"
      # HTTP monitoring (status, JetStream introspection, healthz).
      - "8222:8222"
    volumes:
      - nats-storage:/data
    restart: unless-stopped
    healthcheck:
      # /healthz returns 200 when the server is fully started and (with
      # JetStream enabled) the JS meta cluster is ready.
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s

volumes:
  solace-storage:
  nats-storage:
